<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 立体爱心</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.8);
            font-size: 16px;
            text-align: center;
            pointer-events: none;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="info">右键拖拽旋转 · 81个模块自动向外扩散</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script>
        let scene, camera, renderer, heartGroup, controls;
        let isDragging = false;
        let segments = [];
        let time = 0;
        let expandProgress = 0;
        let clickedCount = 0;
        let activeSegments = [];
        let dummy = new THREE.Object3D();

        function init() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a1a);

            camera = new THREE.PerspectiveCamera(
                60,
                window.innerWidth / window.innerHeight,
                0.1,
                1000
            );
            camera.position.set(0, 0, 8);

            renderer = new THREE.WebGLRenderer({ antialias: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
            container.appendChild(renderer.domElement);

            addLights();
            createHeart();
            setupControls();

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function addLights() {
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const mainLight = new THREE.DirectionalLight(0xffffff, 0.8);
            mainLight.position.set(3, 5, 5);
            scene.add(mainLight);

            const fillLight = new THREE.DirectionalLight(0xff6b9d, 0.4);
            fillLight.position.set(-3, 2, -3);
            scene.add(fillLight);
        }

        function createHeart() {
            heartGroup = new THREE.Group();
            
            const sphereGeometry = new THREE.SphereGeometry(0.055, 6, 4);
            const material = new THREE.MeshStandardMaterial({
                color: 0xff1493,
                metalness: 0.05,
                roughness: 0.4
            });

            const positions = getHeartPositions();
            
            const bounds = {
                minX: -2.5, maxX: 2.5,
                minY: -2, maxY: 2.5
            };
            
            const gridSize = 9;
            const cellSizeX = (bounds.maxX - bounds.minX) / gridSize;
            const cellSizeY = (bounds.maxY - bounds.minY) / gridSize;
            
            for (let i = 0; i < 81; i++) {
                segments[i] = {
                    instancedMesh: null,
                    center: new THREE.Vector3(),
                    sphereData: [],
                    isReturning: false,
                    returnProgress: 0,
                    expandedCenter: new THREE.Vector3()
                };
            }
            
            positions.forEach(pos => {
                let ix = Math.floor((pos.x - bounds.minX) / cellSizeX);
                let iy = Math.floor((pos.y - bounds.minY) / cellSizeY);
                
                ix = Math.max(0, Math.min(gridSize - 1, ix));
                iy = Math.max(0, Math.min(gridSize - 1, iy));
                
                const segmentIndex = ix + iy * gridSize;
                
                const hue = Math.random() * 0.1 + 0.9;
                const color = new THREE.Color();
                color.setHSL(hue, 0.8, 0.55);
                
                segments[segmentIndex].sphereData.push({
                    originalPos: new THREE.Vector3(pos.x, pos.y, pos.z),
                    offsetFromCenter: new THREE.Vector3(),
                    color: color
                });
            });
            
            for (let i = 0; i < 81; i++) {
                const seg = segments[i];
                const ix = i % gridSize;
                const iy = Math.floor(i / gridSize);
                
                if (seg.sphereData.length === 0) {
                    const u = (iy / gridSize) * Math.PI * 2;
                    const s = 0.5 + Math.random() * 0.3;
                    const x = 16 * Math.pow(Math.sin(u), 3) * s * 0.15;
                    const y = (13 * Math.cos(u) - 5 * Math.cos(2 * u) - 2 * Math.cos(3 * u) - Math.cos(4 * u)) * s * 0.15 - 0.5;
                    
                    const hue = Math.random() * 0.1 + 0.9;
                    const color = new THREE.Color();
                    color.setHSL(hue, 0.8, 0.55);
                    
                    seg.sphereData.push({
                        originalPos: new THREE.Vector3(x, y, 0),
                        offsetFromCenter: new THREE.Vector3(),
                        color: color
                    });
                    seg.center.set(x, y, 0);
                } else {
                    const center = new THREE.Vector3();
                    seg.sphereData.forEach(data => {
                        center.add(data.originalPos);
                    });
                    center.divideScalar(seg.sphereData.length);
                    seg.center.copy(center);
                }
                
                seg.sphereData.forEach(data => {
                    data.offsetFromCenter.subVectors(data.originalPos, seg.center);
                });
                
                seg.expandedCenter.copy(seg.center.clone().multiplyScalar(3));
                
                seg.instancedMesh = new THREE.InstancedMesh(
                    sphereGeometry,
                    material.clone(),
                    seg.sphereData.length
                );
                
                seg.sphereData.forEach((data, j) => {
                    const expandedPos = seg.expandedCenter.clone().add(data.offsetFromCenter);
                    dummy.position.copy(expandedPos);
                    dummy.updateMatrix();
                    seg.instancedMesh.setMatrixAt(j, dummy.matrix);
                    seg.instancedMesh.setColorAt(j, data.color);
                });
                
                seg.instancedMesh.instanceMatrix.needsUpdate = true;
                
                activeSegments.push(i);
                heartGroup.add(seg.instancedMesh);
            }

            scene.add(heartGroup);
            updateInfo();
        }

        function getHeartPositions() {
            const positions = [];
            
            for (let s = 0.1; s <= 1; s += 0.06) {
                for (let u = 0; u < Math.PI * 2; u += 0.12) {
                    for (let t = 0; t < Math.PI * 2; t += 0.3) {
                        const r = 0.25 * (1 - s) * 0.5;
                        const x = 16 * Math.pow(Math.sin(u), 3) * s * 0.15 + Math.cos(t) * r;
                        const y = (13 * Math.cos(u) - 5 * Math.cos(2 * u) - 2 * Math.cos(3 * u) - Math.cos(4 * u)) * s * 0.15 - 0.5 + Math.sin(t) * r * 0.5;
                        const z = Math.sin(t) * r * 1.5;
                        
                        positions.push({ x, y, z });
                    }
                }
            }
            
            for (let layer = -15; layer <= 15; layer++) {
                const z = layer * 0.08;
                const zFactor = 1 - Math.abs(z) / 1.5;
                if (zFactor < 0.1) continue;
                
                for (let s = 0.1; s <= zFactor; s += 0.08) {
                    for (let u = 0; u < Math.PI * 2; u += 0.1) {
                        const x = 16 * Math.pow(Math.sin(u), 3) * s * 0.15;
                        const y = (13 * Math.cos(u) - 5 * Math.cos(2 * u) - 2 * Math.cos(3 * u) - Math.cos(4 * u)) * s * 0.15 - 0.5;
                        
                        positions.push({ x, y, z });
                    }
                }
            }
            
            return positions;
        }

        function setupControls() {
            const canvas = renderer.domElement;

            let startX = 0;
            let startY = 0;
            let startRotationX = 0;
            let startRotationY = 0;

            canvas.addEventListener('contextmenu', (e) => e.preventDefault());

            canvas.addEventListener('mousedown', (e) => {
                if (e.button === 2) {
                    isDragging = true;
                    startX = e.clientX;
                    startY = e.clientY;
                    startRotationX = heartGroup.rotation.x;
                    startRotationY = heartGroup.rotation.y;
                    canvas.style.cursor = 'grabbing';
                }
            });

            canvas.addEventListener('mousemove', (e) => {
                if (isDragging) {
                    const deltaX = e.clientX - startX;
                    const deltaY = e.clientY - startY;
                    
                    heartGroup.rotation.y = startRotationY + deltaX * 0.01;
                    heartGroup.rotation.x = startRotationX + deltaY * 0.01;
                }
            });

            canvas.addEventListener('mouseup', () => {
                isDragging = false;
                canvas.style.cursor = 'default';
            });

            canvas.addEventListener('mouseleave', () => {
                isDragging = false;
                canvas.style.cursor = 'default';
            });

            canvas.addEventListener('wheel', (e) => {
                e.preventDefault();
                camera.position.z += e.deltaY * 0.01;
                camera.position.z = Math.max(4, Math.min(20, camera.position.z));
            }, { passive: false });

            canvas.addEventListener('click', (e) => {
                if (activeSegments.length > 0 && clickedCount < 81) {
                    const randomIndex = Math.floor(Math.random() * activeSegments.length);
                    const segmentIndex = activeSegments[randomIndex];
                    
                    segments[segmentIndex].isReturning = true;
                    activeSegments.splice(randomIndex, 1);
                    clickedCount++;
                    
                    updateInfo();
                }
            });
        }

        function updateInfo() {
            const info = document.getElementById('info');
            if (clickedCount >= 81) {
                info.textContent = '完成！完整爱心已呈现！';
            } else {
                info.textContent = `点击屏幕让模块归位 · ${clickedCount}/81`;
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            time += 0.016;
            
            segments.forEach(seg => {
                if (seg.instancedMesh && seg.sphereData.length > 0) {
                    if (seg.isReturning && seg.returnProgress < 1) {
                        seg.returnProgress = Math.min(1, seg.returnProgress + 0.025);
                        
                        const t = easeInOutCubic(seg.returnProgress);
                        
                        seg.sphereData.forEach((data, j) => {
                            const expandedPos = seg.expandedCenter.clone().add(data.offsetFromCenter);
                            const targetPos = data.originalPos;
                            
                            dummy.position.lerpVectors(expandedPos, targetPos, t);
                            dummy.updateMatrix();
                            seg.instancedMesh.setMatrixAt(j, dummy.matrix);
                        });
                        
                        seg.instancedMesh.instanceMatrix.needsUpdate = true;
                    }
                }
            });

            if (!isDragging) {
                heartGroup.rotation.y += 0.002;
            }

            renderer.render(scene, camera);
        }

        function easeInOutCubic(t) {
            return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        }

        init();
    </script>
</body>
</html>
